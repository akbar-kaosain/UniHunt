<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA Universities Admission Deadlines for PhD in CS and ECE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 18px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #4CAF50;
      color: white;
      font-size: 20px;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    tr:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h1>        USA Universities Admission Deadlines for PhD in CS and ECE</h1>
  <table id="googleSheetTable"></table>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6fC63-2MbEhNfprnZL_iddJobYRPI-bzzw5ZN66xEMg5YFAz2z-ZbcQoHw6sFY1GG-8YRi_bQLiPa/pub?gid=0&single=true&output=csv";  // Replace with your published CSV URL

    fetch(csvUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.split("\n");
        let tableHTML = "<tr>";

        // Create table headers
        const headers = rows[0].split(",");
        headers.forEach(header => {
          tableHTML += `<th>${header.trim()}</th>`;
        });
        tableHTML += "</tr>";

        // Create table rows
        rows.slice(1).forEach(row => {
          const cells = row.split(",");
          tableHTML += "<tr>";
          cells.forEach(cell => {
            tableHTML += `<td>${cell.trim()}</td>`;
          });
          tableHTML += "</tr>";
        });

        document.getElementById("googleSheetTable").innerHTML = tableHTML;
      })
      .catch(error => console.error("Error fetching the CSV file:", error));
  </script>
</body>
</html>
